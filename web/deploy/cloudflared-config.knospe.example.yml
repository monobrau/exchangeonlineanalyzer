# Example for knospe.org / webhost — merge with your real tunnel id + credentials path.
# Install: sudo cp cloudflared-config.knospe.example.yml /etc/cloudflared/config.yml
#          sudo systemctl restart cloudflared
#
# Requires DNS: Tunnel (or CNAME) for eoa → same tunnel as blingus.

tunnel: 2b306e1d-699d-41c5-8d08-4cd52c2f5960
credentials-file: /root/.cloudflared/2b306e1d-699d-41c5-8d08-4cd52c2f5960.json

ingress:
  - hostname: eoa.knospe.org
    # uvicorn on webhost uses 18080; 8080 is nginx (blingus PHP backend)
    service: http://127.0.0.1:18080
  - hostname: blingus.knospe.org
    service: http://localhost:80
  - service: http_status:404
