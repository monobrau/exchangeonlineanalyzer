<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EOA Investigate</title>
  <style>
    :root { font-family: Segoe UI, system-ui, sans-serif; color: #1a1a1a; background: #f4f6f8; }
    body { margin: 0; padding: 1rem 1.25rem 2rem; }
    h1 { margin: 0; font-size: 1.25rem; }
    h2 { font-size: 1rem; margin: 0 0 0.5rem; }
    a { color: #0969da; }
    .muted { color: #57606a; font-size: 0.88rem; }
    .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 0.85rem 1rem; margin-bottom: 0.85rem; }
    button { margin: 0.15rem 0.3rem 0.15rem 0; padding: 0.4rem 0.75rem; cursor: pointer; border-radius: 6px; border: 1px solid #8c959f; background: #f6f8fa; }
    button.primary { background: #0969da; color: #fff; border-color: #0969da; }
    button.small { padding: 0.25rem 0.55rem; font-size: 0.82rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="text"], input[type="datetime-local"], input[type="number"], select {
      padding: 0.3rem 0.4rem; font: inherit; border: 1px solid #d0d7de; border-radius: 6px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.45rem 0.85rem; align-items: center; margin-bottom: 0.4rem; }
    .path { font-size: 0.82rem; word-break: break-all; }
    .status { min-height: 1.2rem; }
    .graphWrap { display: block; }
    #network { height: 380px; border: 1px solid #eaeef2; border-radius: 6px; background: #fafbfc; }
    .timelineWrap { margin-top: 0.35rem; overflow-x: auto; }
    .timelineChart { display: flex; align-items: flex-end; gap: 3px; min-height: 160px; padding: 0.25rem 0 0; }
    .timelineCol { flex: 1 1 0; min-width: 18px; max-width: 36px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    .timelineBar { width: 70%; min-height: 2px; background: #0969da; border-radius: 3px 3px 0 0; cursor: pointer; }
    .timelineBar.zero { background: #d0d7de; cursor: default; min-height: 2px; }
    .timelineBar:hover:not(.zero) { background: #0550ae; }
    .timelineLbl { font-size: 0.62rem; color: #57606a; writing-mode: vertical-rl; transform: rotate(180deg); margin-top: 0.3rem; height: 4.2rem; }
    .tabs { display: flex; gap: 0.25rem; margin-bottom: 0.45rem; }
    .tabs button.active { background: #0969da; color: #fff; border-color: #0969da; }
    table.data { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    table.data th, table.data td { text-align: left; padding: 0.3rem 0.45rem; border-bottom: 1px solid #eaeef2; vertical-align: top; max-width: 22rem; overflow-wrap: anywhere; }
    table.data th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    table.data th.sortable:hover { color: #0969da; }
    table.data tr:hover { background: #f6f8fa; }
    table.data tr.selected { background: #ddf4ff; }
    .detail { white-space: pre-wrap; font-size: 0.78rem; background: #0d1117; color: #c9d1d9; padding: 0.65rem; border-radius: 6px; max-height: 16rem; overflow: auto; display: none; }
    .detail.show { display: block; }
    label { display: inline-flex; align-items: center; gap: 0.3rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <a href="index.html">&larr; Back to web runner</a>
      <h1>Investigate logs</h1>
      <span id="clientLabel" class="muted"></span>
    </div>
    <div class="path muted" id="folderPath"></div>
    <div class="row" style="margin-top:0.45rem">
      <input type="text" id="folderInput" style="min-width:28rem;flex:1" placeholder="Report folder path" />
      <button type="button" id="reloadBtn" class="primary small">Load folder</button>
    </div>
    <div class="status muted" id="status">Set a report folder to begin.</div>
  </div>

  <div class="card">
    <h2>Filters</h2>
    <div class="row">
      <label>From <input type="datetime-local" id="timeStart" /></label>
      <label>To <input type="datetime-local" id="timeEnd" /></label>
      <label>Address / UPN <input type="text" id="addressQ" placeholder="contains" style="min-width:14rem" /></label>
      <label>IP <input type="text" id="ipQ" placeholder="contains" style="min-width:10rem" /></label>
      <label>Status / operation <input type="text" id="statusQ" placeholder="Delivered, MailItemsAccessed…" style="min-width:14rem" /></label>
      <button type="button" id="applyBtn" class="primary small">Apply</button>
      <button type="button" id="clearBtn" class="small">Clear</button>
    </div>
  </div>

  <div class="card">
    <h2>Mail activity</h2>
    <div class="row">
      <label>Min messages <input type="number" id="minCount" value="1" min="1" style="width:4.5rem" /></label>
      <label>Max nodes <input type="number" id="maxNodes" value="80" min="5" max="200" style="width:4.5rem" /></label>
      <label>Bucket
        <select id="bucket">
          <option value="hour">Hour</option>
          <option value="day">Day</option>
        </select>
      </label>
      <label><input type="checkbox" id="hideInternal" /> Hide internal (same domain)</label>
      <button type="button" id="graphBtn" class="small">Refresh graph</button>
    </div>
    <div class="muted" id="graphMeta"></div>
    <div class="graphWrap">
      <div class="muted">Who mailed whom — click a node to pin that address</div>
      <div id="network"></div>
      <div class="muted" style="margin-top:0.75rem">Volume over time — click a bar to set the time range</div>
      <div class="timelineWrap">
        <div id="timeline" class="timelineChart"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button type="button" class="tabBtn active" data-source="MessageTrace">Message trace</button>
      <button type="button" class="tabBtn" data-source="SignInLogs">Sign-in</button>
      <button type="button" class="tabBtn" data-source="UnifiedAuditLogs">UAL</button>
    </div>
    <div class="row">
      <span class="muted" id="tableMeta">No rows loaded.</span>
      <button type="button" id="prevBtn" class="small" disabled>Prev</button>
      <button type="button" id="nextBtn" class="small" disabled>Next</button>
      <button type="button" id="exportBtn" class="small">Export filtered CSV</button>
    </div>
    <div style="overflow:auto">
      <table class="data" id="dataTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <pre class="detail" id="rowDetail"></pre>
  </div>

  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="investigate.js"></script>
</body>
</html>
